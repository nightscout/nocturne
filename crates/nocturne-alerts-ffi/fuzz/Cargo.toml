[package]
name = "nocturne-alerts-fuzz"
version = "0.0.0"
edition = "2024"
description = "cargo-fuzz targets for the alert engine's parsers and C ABI; built on nightly, outside the stable workspace"
license = "AGPL-3.0-only"
publish = false

[package.metadata]
cargo-fuzz = true

[lib]
name = "nocturne_alerts_fuzz"
path = "src/lib.rs"

[dependencies]
libfuzzer-sys = "0.4"
chrono = { version = "0.4", default-features = false }
uuid = "1"
nocturne-alerts-core = { path = "../../nocturne-alerts-core" }
nocturne-alerts-ffi = { path = ".." }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }

# Its own workspace root: the stable workspace one level up never compiles it.
[workspace]

[[bin]]
name = "node_parse"
path = "fuzz_targets/node_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_payload"
path = "fuzz_targets/parse_payload.rs"
test = false
doc = false
bench = false

