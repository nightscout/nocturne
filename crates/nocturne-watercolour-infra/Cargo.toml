[package]
name = "nocturne-watercolour-infra"
version = "0.1.0"
edition = "2024"
description = "Watercolour graphics engine infrastructure: wgpu/WGSL simulation and rendering, versioned scene documents, PNG export, artwork catalogue"
license = "AGPL-3.0-only"
publish = false

[dependencies]
nocturne-watercolour-core = { path = "../nocturne-watercolour-core" }
wgpu = { version = "30.0.1", features = ["webgpu"] }
bytemuck = { version = "1.25", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"

# Blocking waits are the native path only; in the browser every GPU wait is a
# promise, so the engine exposes async constructors and readback there.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3.105", features = ["HtmlCanvasElement"] }
