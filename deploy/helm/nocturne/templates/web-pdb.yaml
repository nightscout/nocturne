{{- if .Values.web.pdb.enabled -}}
{{- $min := .Values.web.pdb.minAvailable }}
{{- $byMax := and (gt (int .Values.web.pdb.maxUnavailable) 0) (eq (int $min) 0) }}
{{- if and (not $byMax) (not (hasSuffix "%" (toString $min))) (ge (int $min) (int .Values.web.replicaCount)) }}
{{- fail "web.pdb.minAvailable must be below web.replicaCount: a budget that keeps every web pod available blocks every node drain." }}
{{- end }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "nocturne.web.fullname" . }}
  labels:
    {{- include "nocturne.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  {{- if and (gt (int .Values.web.pdb.maxUnavailable) 0) (eq (int .Values.web.pdb.minAvailable) 0) }}
  maxUnavailable: {{ .Values.web.pdb.maxUnavailable }}
  {{- else }}
  minAvailable: {{ .Values.web.pdb.minAvailable }}
  {{- end }}
  selector:
    matchLabels: {{- include "nocturne.web.selectorLabels" . | nindent 6 }}
{{- end }}
