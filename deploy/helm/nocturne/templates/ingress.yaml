{{- if .Values.ingress.enabled -}}
{{- /*
  One Ingress, one or more hosts. `ingress.hosts` serves multiple hosts (e.g.
  tenant subdomains) from a single Ingress; `ingress.host` remains supported
  for a single host. Either must be set when ingress.enabled=true.
*/}}
{{- $hosts := .Values.ingress.hosts | default (list .Values.ingress.host) | compact -}}
{{- if not $hosts -}}
{{- fail "ingress.host or ingress.hosts is required when ingress.enabled=true" -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "nocturne.fullname" . }}
  labels: {{- include "nocturne.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        {{- range $hosts }}
        - {{ . | quote }}
        {{- end }}
      {{- with .Values.ingress.tls.secretName }}
      secretName: {{ . }}
      {{- end }}
  {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          {{- with $.Values.ingress.api.externalPath }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "nocturne.api.fullname" $ }}
                port:
                  name: http
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "nocturne.web.fullname" $ }}
                port:
                  name: http
    {{- end }}
{{- end }}
