services:
  nocturne-postgres-server:
    image: "docker.io/library/postgres:17.6"
    environment:
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_USER: "${POSTGRES_USERNAME}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "nocturne"
      NOCTURNE_MIGRATOR_PASSWORD: "${POSTGRES_MIGRATOR_PASSWORD}"
      NOCTURNE_APP_PASSWORD: "${POSTGRES_APP_PASSWORD}"
      NOCTURNE_WEB_PASSWORD: "${POSTGRES_WEB_PASSWORD}"
    expose:
    - "5432"
    volumes:
    - type: "${POSTGRES_DATA_MOUNT_TYPE:-volume}"
      target: "/var/lib/postgresql/data"
      source: "${POSTGRES_DATA_PATH:-nocturne-postgres-data}"
      read_only: false
    networks:
    - "aspire"
    configs:
    - source: nocturne-init
      target: /docker-entrypoint-initdb.d/00-init.sh
      mode: 493
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -p 5432
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s
    labels:
      com.centurylinklabs.watchtower.enable: "true"
  nocturne-api:
    image: "${NOCTURNE_API_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "8080"
      INSTANCE_KEY: "${INSTANCE_KEY}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT}"
      OTEL_EXPORTER_OTLP_PROTOCOL: "${OTEL_EXPORTER_OTLP_PROTOCOL}"
      ConnectionStrings__nocturne-postgres: "Host=nocturne-postgres-server;Port=5432;Database=nocturne;Username=nocturne_app;Password=${POSTGRES_APP_PASSWORD}"
      ConnectionStrings__nocturne-postgres-migrator: "Host=nocturne-postgres-server;Port=5432;Database=nocturne;Username=nocturne_migrator;Password=${POSTGRES_MIGRATOR_PASSWORD}"
      DemoService__Enabled: "false"
      WEB_URL: "http://nocturne-web:8000"
      BASE_DOMAIN: "${BASE_DOMAIN}"
    expose:
    - "8080"
    depends_on:
      nocturne-postgres-server:
        condition: service_healthy
    networks:
    - "aspire"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
  nocturne-web:
    image: "${NOCTURNE_WEB_IMAGE}"
    environment:
      PORT: "8000"
      NOCTURNE_API_HTTP: "http://nocturne-api:8080"
      services__nocturne-api__http__0: "http://nocturne-api:8080"
      PUBLIC_API_URL: "http://nocturne-api:8080"
      NOCTURNE_API_URL: "http://nocturne-api:8080"
      INSTANCE_KEY: "${INSTANCE_KEY}"
      DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN}"
      DISCORD_PUBLIC_KEY: "${DISCORD_PUBLIC_KEY}"
      DISCORD_APPLICATION_ID: "${DISCORD_APPLICATION_ID}"
      DISCORD_CLIENT_SECRET: "${DISCORD_CLIENT_SECRET}"
      BASE_DOMAIN: "${BASE_DOMAIN}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      TELEGRAM_WEBHOOK_SECRET_TOKEN: "${TELEGRAM_WEBHOOK_SECRET_TOKEN}"
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN}"
      SLACK_SIGNING_SECRET: "${SLACK_SIGNING_SECRET}"
      WHATSAPP_ACCESS_TOKEN: "${WHATSAPP_ACCESS_TOKEN}"
      WHATSAPP_VERIFY_TOKEN: "${WHATSAPP_VERIFY_TOKEN}"
      WHATSAPP_APP_SECRET: "${WHATSAPP_APP_SECRET}"
      WHATSAPP_PHONE_NUMBER_ID: "${WHATSAPP_PHONE_NUMBER_ID}"
      RESEND_API_KEY: "${RESEND_API_KEY}"
      RESEND_FROM_ADDRESS: "${RESEND_FROM_ADDRESS}"
      RESEND_FROM_NAME: "${RESEND_FROM_NAME}"
      RESEND_WEBHOOK_SECRET: "${RESEND_WEBHOOK_SECRET}"
      PROTOCOL_HEADER: "x-forwarded-proto"
      HOST_HEADER: "x-forwarded-host"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT}"
      OTEL_EXPORTER_OTLP_PROTOCOL: "${OTEL_EXPORTER_OTLP_PROTOCOL}"
      NOCTURNE_POSTGRES_URI: "postgresql://nocturne_web:${POSTGRES_WEB_PASSWORD}@nocturne-postgres-server:5432/nocturne"
    expose:
    - "8000"
    depends_on:
      nocturne-api:
        condition: "service_started"
    networks:
    - "aspire"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
  gateway:
    image: "mcr.microsoft.com/dotnet/nightly/yarp:2.3-preview"
    command:
    - "/app/yarp.dll"
    entrypoint:
    - "dotnet"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      REVERSEPROXY__CLUSTERS__cluster_nocturne-web__HTTPREQUEST__ACTIVITYTIMEOUT: "00:05:00"
      REVERSEPROXY__ROUTES__route0__MATCH__PATH: "/api/auth/oidc/{**catch-all}"
      REVERSEPROXY__ROUTES__route0__CLUSTERID: "cluster_nocturne-api"
      REVERSEPROXY__ROUTES__route0__TRANSFORMS__0__X-Forwarded: "Off"
      REVERSEPROXY__ROUTES__route0__TRANSFORMS__0__HeaderPrefix: "X-Forwarded-"
      REVERSEPROXY__ROUTES__route0__TRANSFORMS__1__RequestHeaderOriginalHost: "True"
      REVERSEPROXY__ROUTES__route1__MATCH__PATH: "/api/oauth/{**catch-all}"
      REVERSEPROXY__ROUTES__route1__CLUSTERID: "cluster_nocturne-api"
      REVERSEPROXY__ROUTES__route1__TRANSFORMS__0__X-Forwarded: "Off"
      REVERSEPROXY__ROUTES__route1__TRANSFORMS__0__HeaderPrefix: "X-Forwarded-"
      REVERSEPROXY__ROUTES__route1__TRANSFORMS__1__RequestHeaderOriginalHost: "True"
      REVERSEPROXY__ROUTES__route2__MATCH__PATH: "/api/v4/dev-only/{**catch-all}"
      REVERSEPROXY__ROUTES__route2__CLUSTERID: "cluster_nocturne-api"
      REVERSEPROXY__ROUTES__route2__TRANSFORMS__0__X-Forwarded: "Off"
      REVERSEPROXY__ROUTES__route2__TRANSFORMS__0__HeaderPrefix: "X-Forwarded-"
      REVERSEPROXY__ROUTES__route2__TRANSFORMS__1__RequestHeaderOriginalHost: "True"
      REVERSEPROXY__ROUTES__route3__MATCH__PATH: "/api/auth/platform-access/{**catch-all}"
      REVERSEPROXY__ROUTES__route3__CLUSTERID: "cluster_nocturne-api"
      REVERSEPROXY__ROUTES__route3__TRANSFORMS__0__X-Forwarded: "Off"
      REVERSEPROXY__ROUTES__route3__TRANSFORMS__0__HeaderPrefix: "X-Forwarded-"
      REVERSEPROXY__ROUTES__route3__TRANSFORMS__1__RequestHeaderOriginalHost: "True"
      REVERSEPROXY__ROUTES__route4__MATCH__PATH: "/api/auth/platform-access"
      REVERSEPROXY__ROUTES__route4__CLUSTERID: "cluster_nocturne-api"
      REVERSEPROXY__ROUTES__route4__TRANSFORMS__0__X-Forwarded: "Off"
      REVERSEPROXY__ROUTES__route4__TRANSFORMS__0__HeaderPrefix: "X-Forwarded-"
      REVERSEPROXY__ROUTES__route4__TRANSFORMS__1__RequestHeaderOriginalHost: "True"
      REVERSEPROXY__ROUTES__route5__MATCH__PATH: "/api/{**catch-all}"
      REVERSEPROXY__ROUTES__route5__CLUSTERID: "cluster_nocturne-web"
      REVERSEPROXY__ROUTES__route5__TRANSFORMS__0__X-Forwarded: "Off"
      REVERSEPROXY__ROUTES__route5__TRANSFORMS__0__HeaderPrefix: "X-Forwarded-"
      REVERSEPROXY__ROUTES__route5__TRANSFORMS__1__RequestHeaderOriginalHost: "True"
      REVERSEPROXY__ROUTES__route6__MATCH__PATH: "/auth/bot/{**catch-all}"
      REVERSEPROXY__ROUTES__route6__CLUSTERID: "cluster_nocturne-web"
      REVERSEPROXY__ROUTES__route6__TRANSFORMS__0__X-Forwarded: "Off"
      REVERSEPROXY__ROUTES__route6__TRANSFORMS__0__HeaderPrefix: "X-Forwarded-"
      REVERSEPROXY__ROUTES__route6__TRANSFORMS__1__RequestHeaderOriginalHost: "True"
      REVERSEPROXY__ROUTES__route7__MATCH__PATH: "/scalar"
      REVERSEPROXY__ROUTES__route7__CLUSTERID: "cluster_nocturne-api"
      REVERSEPROXY__ROUTES__route7__TRANSFORMS__0__X-Forwarded: "Off"
      REVERSEPROXY__ROUTES__route7__TRANSFORMS__0__HeaderPrefix: "X-Forwarded-"
      REVERSEPROXY__ROUTES__route7__TRANSFORMS__1__RequestHeaderOriginalHost: "True"
      REVERSEPROXY__ROUTES__route8__MATCH__PATH: "/scalar/{**catch-all}"
      REVERSEPROXY__ROUTES__route8__CLUSTERID: "cluster_nocturne-api"
      REVERSEPROXY__ROUTES__route8__TRANSFORMS__0__X-Forwarded: "Off"
      REVERSEPROXY__ROUTES__route8__TRANSFORMS__0__HeaderPrefix: "X-Forwarded-"
      REVERSEPROXY__ROUTES__route8__TRANSFORMS__1__RequestHeaderOriginalHost: "True"
      REVERSEPROXY__ROUTES__route9__MATCH__PATH: "/openapi/{**catch-all}"
      REVERSEPROXY__ROUTES__route9__CLUSTERID: "cluster_nocturne-api"
      REVERSEPROXY__ROUTES__route9__TRANSFORMS__0__X-Forwarded: "Off"
      REVERSEPROXY__ROUTES__route9__TRANSFORMS__0__HeaderPrefix: "X-Forwarded-"
      REVERSEPROXY__ROUTES__route9__TRANSFORMS__1__RequestHeaderOriginalHost: "True"
      REVERSEPROXY__ROUTES__route10__MATCH__PATH: "/.well-known/{**catch-all}"
      REVERSEPROXY__ROUTES__route10__CLUSTERID: "cluster_nocturne-api"
      REVERSEPROXY__ROUTES__route10__TRANSFORMS__0__X-Forwarded: "Off"
      REVERSEPROXY__ROUTES__route10__TRANSFORMS__0__HeaderPrefix: "X-Forwarded-"
      REVERSEPROXY__ROUTES__route10__TRANSFORMS__1__RequestHeaderOriginalHost: "True"
      REVERSEPROXY__ROUTES__route11__MATCH__PATH: "/pebble"
      REVERSEPROXY__ROUTES__route11__CLUSTERID: "cluster_nocturne-api"
      REVERSEPROXY__ROUTES__route11__TRANSFORMS__0__X-Forwarded: "Off"
      REVERSEPROXY__ROUTES__route11__TRANSFORMS__0__HeaderPrefix: "X-Forwarded-"
      REVERSEPROXY__ROUTES__route11__TRANSFORMS__1__RequestHeaderOriginalHost: "True"
      REVERSEPROXY__ROUTES__route12__MATCH__PATH: "/{**catchall}"
      REVERSEPROXY__ROUTES__route12__CLUSTERID: "cluster_nocturne-web"
      REVERSEPROXY__ROUTES__route12__TRANSFORMS__0__X-Forwarded: "Off"
      REVERSEPROXY__ROUTES__route12__TRANSFORMS__0__HeaderPrefix: "X-Forwarded-"
      REVERSEPROXY__ROUTES__route12__TRANSFORMS__1__RequestHeaderOriginalHost: "True"
      REVERSEPROXY__CLUSTERS__cluster_nocturne-api__DESTINATIONS__destination1__ADDRESS: "http://nocturne-api"
      REVERSEPROXY__CLUSTERS__cluster_nocturne-web__DESTINATIONS__destination1__ADDRESS: "http://nocturne-web"
      NOCTURNE_API_HTTP: "http://nocturne-api:8080"
      services__nocturne-api__http__0: "http://nocturne-api:8080"
      NOCTURNE_WEB_HTTP: "http://nocturne-web:8000"
      services__nocturne-web__http__0: "http://nocturne-web:8000"
    expose:
    - "5000"
    depends_on:
      nocturne-api:
        condition: "service_started"
      nocturne-web:
        condition: "service_started"
    networks:
    - "aspire"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
  caddy:
    image: "caddy:2"
    environment:
      BASE_DOMAIN: "${BASE_DOMAIN}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES}"
    ports:
    - "80:80"
    - "443:443"
    - "443:443/udp"
    volumes:
    - type: "volume"
      target: "/data"
      source: "caddy-data"
      read_only: false
    - type: "volume"
      target: "/config"
      source: "caddy-config"
      read_only: false
    depends_on:
      gateway:
        condition: "service_started"
    networks:
    - "aspire"
    configs:
    - source: nocturne-caddyfile
      target: /etc/caddy/Caddyfile
      mode: 420
    labels:
      com.centurylinklabs.watchtower.enable: "true"
  watchtower:
    image: "ghcr.io/nicholas-fedor/watchtower:latest"
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "86400"
      WATCHTOWER_INCLUDE_STOPPED: "false"
      WATCHTOWER_REVIVE_STOPPED: "false"
      WATCHTOWER_LABEL_ENABLE: "true"
    volumes:
    - type: "bind"
      target: "/var/run/docker.sock"
      source: "/var/run/docker.sock"
      read_only: false
    networks:
    - "aspire"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
networks:
  aspire:
    driver: "bridge"
volumes:
  nocturne-postgres-data:
    driver: "local"
  caddy-data:
    driver: "local"
  caddy-config:
    driver: "local"
configs:
  nocturne-init:
    content: |
      #!/bin/bash
      # Nocturne PostgreSQL init script (container bootstrap)
      # =====================================================
      #
      # This script runs automatically on first container start (via the standard
      # /docker-entrypoint-initdb.d/ mechanism) for the Aspire dev stack and the
      # self-hosted docker-compose bundle. It creates the nocturne_migrator and
      # nocturne_app roles that Nocturne requires.
      #
      # This runs only against a fresh data directory, so the SQL does not need to
      # be idempotent. For bring-your-own-PostgreSQL deployments where you need
      # idempotency against an existing database, use bootstrap-roles.sql instead.
      #
      # Expected environment variables (set by the compose/AppHost that owns the
      # Postgres container):
      #
      #   POSTGRES_DB                  database name (set by the Postgres image)
      #   POSTGRES_USER                superuser name (set by the Postgres image)
      #   NOCTURNE_MIGRATOR_PASSWORD   password for nocturne_migrator
      #   NOCTURNE_APP_PASSWORD        password for nocturne_app
      #   NOCTURNE_WEB_PASSWORD        password for nocturne_web (bot state)
      #
      # Passwords are passed to psql via -v variables (not shell interpolation
      # inside the SQL text) so that values containing quotes or dollar signs are
      # handled safely by psql's :'var' quoting.

      set -euo pipefail

      : "$${POSTGRES_DB:?POSTGRES_DB must be set}"
      : "$${POSTGRES_USER:?POSTGRES_USER must be set}"
      : "$${NOCTURNE_MIGRATOR_PASSWORD:?NOCTURNE_MIGRATOR_PASSWORD must be set}"
      : "$${NOCTURNE_APP_PASSWORD:?NOCTURNE_APP_PASSWORD must be set}"
      : "$${NOCTURNE_WEB_PASSWORD:?NOCTURNE_WEB_PASSWORD must be set}"

      psql \
          --username "$$POSTGRES_USER" \
          --dbname "$$POSTGRES_DB" \
          --set ON_ERROR_STOP=on \
          --set DBNAME="$$POSTGRES_DB" \
          --set migrator_password="$$NOCTURNE_MIGRATOR_PASSWORD" \
          --set app_password="$$NOCTURNE_APP_PASSWORD" \
          --set web_password="$$NOCTURNE_WEB_PASSWORD" \
          <<'SQL'
      CREATE ROLE nocturne_migrator LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE PASSWORD :'migrator_password';
      CREATE ROLE nocturne_app      LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE PASSWORD :'app_password';
      CREATE ROLE nocturne_web      LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE PASSWORD :'web_password';

      ALTER DATABASE :"DBNAME" OWNER TO nocturne_migrator;
      ALTER SCHEMA public OWNER TO nocturne_migrator;

      GRANT CONNECT ON DATABASE :"DBNAME" TO nocturne_app;
      GRANT USAGE ON SCHEMA public TO nocturne_app;

      -- nocturne_web: owns its own chat_state_* tables (created on first run by
      -- @chat-adapter/state-pg in the SvelteKit app). Needs CREATE on public. It
      -- does NOT get default privileges on migrator-owned tables, so even a bug
      -- in the web layer can't touch Nocturne's tenant tables.
      GRANT CONNECT ON DATABASE :"DBNAME" TO nocturne_web;
      GRANT USAGE, CREATE ON SCHEMA public TO nocturne_web;

      ALTER DEFAULT PRIVILEGES FOR ROLE nocturne_migrator IN SCHEMA public
          GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO nocturne_app;
      ALTER DEFAULT PRIVILEGES FOR ROLE nocturne_migrator IN SCHEMA public
          GRANT USAGE, SELECT ON SEQUENCES TO nocturne_app;
      SQL
  nocturne-caddyfile:
    content: |
      # Nocturne edge TLS terminator.
      #
      # Automatic HTTPS with Let's Encrypt, fronting the internal YARP gateway.
      # The only required configuration is BASE_DOMAIN (set in .env); Caddy obtains
      # and renews all certificates with no API keys.
      #
      #   - {$$BASE_DOMAIN}    the apex (single-tenant deployments live here) — cert
      #                       issued via the HTTP-01 challenge.
      #   - *.{$$BASE_DOMAIN}  per-tenant subdomains — certs minted on demand on first
      #                       request via HTTP-01. The on_demand "ask" endpoint lets
      #                       the API confirm a hostname is a real tenant before Caddy
      #                       requests a certificate, so only valid subdomains issue.
      #   - *.share.{$$BASE_DOMAIN}
      #                       public share links, which are one label deeper. A Caddy
      #                       site-address wildcard matches exactly one label, so this
      #                       needs naming separately or share links never get a cert.
      #                       The ask endpoint resolves the token before authorizing.
      #
      # To front Nocturne with your own reverse proxy instead, disable this service
      # (see docker-compose.byo-proxy.yaml) and the gateway is exposed on plain HTTP.
      #
      # Caddy is the only hop that sees the real peer, so it is the only hop that may name the
      # client. It overwrites X-Forwarded-For with exactly one entry, which the gateway passes
      # through and the API consumes: nothing a caller writes survives, and nothing downstream
      # has to guess how many entries of the chain to believe.
      #
      # TRUSTED_PROXIES is what makes a CDN's client header believable. Left at the default,
      # only the socket peer counts, so a forged CF-Connecting-IP is ignored. Set it to the
      # CDN's published ranges (Cloudflare: https://www.cloudflare.com/ips/) to have the
      # visitor's address recorded instead of the CDN edge's.
      #
      # trusted_proxies_strict is what makes that safe for a CDN that appends to
      # X-Forwarded-For rather than sending CF-Connecting-IP. Without it Caddy falls back to the
      # leftmost valid entry of the chain — the one a caller prepends — and would stamp it as the
      # definitive client. Strict walks from the right instead, skipping declared proxies, so the
      # address is the first hop nobody vouched for.
      {
      	on_demand_tls {
      		ask http://nocturne-api:8080/api/v4/platform/tls-authorize
      	}
      	servers {
      		trusted_proxies static {$$TRUSTED_PROXIES:127.0.0.1/32}
      		trusted_proxies_strict
      		client_ip_headers CF-Connecting-IP X-Forwarded-For
      	}
      }

      (to_gateway) {
      	reverse_proxy gateway:5000 {
      		header_up X-Forwarded-For {http.request.client_ip}
      	}
      }

      {$$BASE_DOMAIN} {
      	import to_gateway
      }

      *.{$$BASE_DOMAIN} {
      	tls {
      		on_demand
      	}
      	import to_gateway
      }

      *.share.{$$BASE_DOMAIN} {
      	tls {
      		on_demand
      	}
      	import to_gateway
      }
...
