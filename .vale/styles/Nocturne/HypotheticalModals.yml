# Rule 3.2 continued. These are softer than "should", and help text sometimes
# reasons about a hypothetical, so they warn rather than fail.
#
# "could not" is the past tense of "cannot", not a hypothetical, and Terms.yml
# requires it in place of "unable to", so it is not matched.
extends: substitution
message: "Rule 3.2: prefer '%s' over '%s', or restructure with 'if'."
link: .claude/skills/simple-english/SKILL.md
level: warning
ignorecase: true
swap:
  may: can
  might: can
  'could(?! not)': can
