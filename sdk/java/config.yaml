generatorName: java
outputDir: ./out
# Overrides ApiClient.mustache so RequestBody.create uses the MediaType-first
# argument order, which exists in both OkHttp 3.12.x and 4.x. Android consumers
# (xDrip) pin OkHttp 3.12.x; the stock template's content-first order is 4.x-only.
# Path is relative to the CI working directory (repo root).
templateDir: sdk/java/templates
globalProperties:
  skipFormModel: true
additionalProperties:
  groupId: org.nightscoutfoundation
  artifactId: nocturne-java
  artifactVersion: "0.1.0"
  apiPackage: org.nightscoutfoundation.nocturne.api
  modelPackage: org.nightscoutfoundation.nocturne.model
  invokerPackage: org.nightscoutfoundation.nocturne
  library: okhttp-gson
  serializationLibrary: gson
  licenseName: AGPL-3.0-only
  sourceFolder: src/main/java
  java8: false
  dateLibrary: java8
  openApiNullable: true
