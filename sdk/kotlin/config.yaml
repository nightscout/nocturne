generatorName: kotlin
outputDir: ./out
# Overrides and the reason for each: sdk/kotlin/templates/README.md.
# Path is relative to the CI working directory (repo root).
templateDir: sdk/kotlin/templates
globalProperties:
  skipFormModel: true
  # Generated test stubs assert nothing, and compiling them outgrew the Kotlin compiler's heap.
  apiTests: false
  modelTests: false
additionalProperties:
  groupId: org.nightscoutfoundation
  artifactId: nocturne
  packageName: org.nightscoutfoundation.nocturne
  artifactVersion: "0.1.0"
  library: jvm-retrofit2
  serializationLibrary: gson
  licenseName: AGPL-3.0-only
  sourceFolder: src/main/kotlin
  useCoroutines: true
