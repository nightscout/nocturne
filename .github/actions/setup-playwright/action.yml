name: Set up Playwright chromium
description: >-
  The headless chromium shell for the Playwright installed in a package, cached by Playwright
  version. The suites always run headless, and the shell is a fraction of the full browser.

inputs:
  working-directory:
    description: The package whose @playwright/test (or vitest browser provider) picks the version.
    required: true

runs:
  using: composite
  steps:
    - id: version
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-shell-${{ runner.os }}-${{ steps.version.outputs.version }}
    # The system libraries the shell needs are not cached, so --with-deps installs them each run.
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm exec playwright install --with-deps --only-shell chromium
