name: Sync SDK OpenAPI Spec

on:
  push:
    branches: [main]
    paths:
      - "src/API/**"
      - "src/Core/**"
      - "sdk/filter-v4-spec.js"
      - ".github/workflows/sync-sdk-spec.yml"

# A merge burst only needs the newest spec; drop superseded runs so the
# auto-commit push never races an older run's stale output.
concurrency:
  group: sync-sdk-spec
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: src/Web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: src/Web
        run: pnpm install --frozen-lockfile

      - name: Build bridge package
        working-directory: src/Web/packages/bridge
        run: pnpm run build

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Build API and generate OpenAPI spec
        working-directory: src/API/Nocturne.API
        run: dotnet build -c Release

      - name: Filter spec to SDK endpoints (V4 + OAuth)
        run: node sdk/filter-v4-spec.js src/Web/packages/app/src/lib/api/generated/openapi.json sdk/openapi-v4.json

      - name: Commit spec changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: sync SDK OpenAPI spec [skip ci]"
          file_pattern: "sdk/openapi-v4.json"
