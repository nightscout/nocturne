name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      # Compiled translation outputs — not source code
      - "src/Web/locales/**"
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '17 13 * * 6'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    # Skip bot-authored pushes (e.g. the translation-sync commit) even if
    # paths-ignore didn't catch it (e.g. a sync commit that also touches
    # other files).
    if: github.actor != 'github-actions[bot]'
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
      pull-requests: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: csharp
          build-mode: none
        - language: javascript-typescript
          build-mode: none

    steps:
    # The C# analysis runs 10-15 minutes, so a pull request that touches no C# skips it. Pushes to
    # main and the weekly schedule always analyse everything, so nothing goes unscanned for long.
    - name: Decide whether to analyse
      id: scope
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ "${{ github.event_name }}" != "pull_request" ] || [ "${{ matrix.language }}" != "csharp" ]; then
          echo "analyse=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        files=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename')
        if grep -qE '\.(cs|csproj|props|targets|razor|cshtml)$|^global\.json$|^\.github/workflows/codeql\.yml$' <<< "$files"; then
          echo "analyse=true" >> "$GITHUB_OUTPUT"
        else
          echo "No C# changes; skipping the C# analysis."
          echo "analyse=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Checkout repository
      if: steps.scope.outputs.analyse == 'true'
      uses: actions/checkout@v5

    - name: Initialize CodeQL
      if: steps.scope.outputs.analyse == 'true'
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Run manual build steps
      if: matrix.build-mode == 'manual'
      shell: bash
      run: |
        echo 'If you are using a "manual" build mode for one or more of the' \
          'languages you are analyzing, replace this with the commands to build' \
          'your code, for example:'
        echo '  make bootstrap'
        echo '  make release'
        exit 1

    - name: Perform CodeQL Analysis
      if: steps.scope.outputs.analyse == 'true'
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
