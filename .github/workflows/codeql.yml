name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '17 13 * * 6'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # A pull request analyses only the languages whose files it touches. Pushes to main and the
  # weekly schedule analyse everything: main pushes also refresh the overlay base database that
  # pull requests' incremental analysis starts from.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.actor != 'github-actions[bot]'
    permissions:
      pull-requests: read
    outputs:
      csharp: ${{ steps.filter.outputs.csharp == 'true' || github.event_name != 'pull_request' }}
      javascript-typescript: ${{ steps.filter.outputs.javascript-typescript == 'true' || github.event_name != 'pull_request' }}
      actions: ${{ steps.filter.outputs.actions == 'true' || github.event_name != 'pull_request' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            shared: &shared
              - '.github/workflows/codeql.yml'
            csharp:
              - *shared
              - '**/*.cs'
              - '**/*.csproj'
              - '**/*.props'
              - '**/*.targets'
              - '**/*.razor'
              - '**/*.cshtml'
              - '**/Directory.*'
              - 'global.json'
              - '**/nuget.config'
              - '**/NuGet.config'
              - '**/*.sln*'
            javascript-typescript:
              - *shared
              - 'src/Web/**'
              - 'e2e/**'
              - '**/*.{js,ts,mjs,cjs,mts,cts,jsx,tsx}'
              - '**/package.json'
              - '**/pnpm-lock.yaml'
              - '**/pnpm-workspace.yaml'
            actions:
              - '.github/**'

  # The matrix job always runs so every "Analyze (<language>)" check reports; an unchanged language
  # skips its steps and the check passes.
  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
      pull-requests: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: csharp
          build-mode: none
        - language: javascript-typescript
          build-mode: none

    steps:
    - name: Checkout repository
      if: needs.changes.outputs[matrix.language] == 'true'
      uses: actions/checkout@v5

    - name: Initialize CodeQL
      if: needs.changes.outputs[matrix.language] == 'true'
      uses: github/codeql-action/init@416ff0dea110f80f0f56f0046500dbf7420e4bb0 # v4.38.2
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Perform CodeQL Analysis
      if: needs.changes.outputs[matrix.language] == 'true'
      uses: github/codeql-action/analyze@416ff0dea110f80f0f56f0046500dbf7420e4bb0 # v4.38.2
      with:
        category: "/language:${{ matrix.language }}"
