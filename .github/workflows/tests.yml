name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which parts of the tree the change touches, so a docs-only pull request skips the heavy jobs.
  # A skipped job reports as skipped, which satisfies a required check; `tests-passed` at the end is
  # the one check to require. Pushes to main and manual runs test everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dotnet: ${{ steps.filter.outputs.dotnet == 'true' || github.event_name != 'pull_request' }}
      web: ${{ steps.filter.outputs.web == 'true' || github.event_name != 'pull_request' }}
      e2e: ${{ steps.filter.outputs.e2e == 'true' || github.event_name != 'pull_request' }}
      migrations: ${{ steps.filter.outputs.migrations == 'true' || github.event_name != 'pull_request' }}
      crates: ${{ steps.filter.outputs.crates == 'true' || github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            shared: &shared
              - '.github/workflows/tests.yml'
              - '.github/actions/**'
              - '.github/scripts/**'
              - 'Directory.Packages.props'
              - 'global.json'
            dotnet:
              - *shared
              - 'src/**/*.cs'
              - 'src/**/*.csproj'
              - 'src/**/*.json'
              - 'tests/**'
              - 'nocturne.sln'
              - 'docs/postgres/**'
              - 'crates/**'
            web:
              - *shared
              - 'src/Web/**'
              - 'src/API/**'
            e2e:
              - *shared
              - 'src/**'
              - 'e2e/**'
              - 'Dockerfile.web'
              - 'docs/postgres/**'
            migrations:
              - *shared
              - 'src/Infrastructure/**'
              - 'src/API/**'
              - 'src/Core/**'
              - 'e2e/**'
              - 'docs/postgres/**'
            crates:
              - *shared
              - 'crates/**'
              - 'src/API/**'
              - 'tests/Parity/**'
              - 'tests/Unit/Nocturne.Alerts.Native.Tests/**'

  # Compiles every test project once and runs the API client codegen (NSwag, then the
  # Zod schemas and remote functions through pnpm) as the API build's post-build step. The test jobs
  # run the assemblies with --no-build; the web jobs read the generated client. A web-only change
  # builds just the API, for the client.
  build:
    needs: changes
    if: >-
      needs.changes.outputs.dotnet == 'true' || needs.changes.outputs.crates == 'true'
      || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUILD_TESTS: ${{ needs.changes.outputs.dotnet == 'true' || needs.changes.outputs.crates == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-dotnet
        with:
          nuget-cache-key: nuget-build
      - uses: ./.github/actions/setup-pnpm
        with:
          install: src/Web
      # No job here builds nocturne.sln — CI builds named projects only (see Build below) — so this
      # is the only thing gating solution membership, and it has to hold in both directions.
      # scripts/Shared is the deliberate omission: scripts/ consumes it through `#:project`.
      - name: Solution and project tree agree
        if: needs.changes.outputs.dotnet == 'true'
        run: |
          tracked=$(git -c core.quotePath=false ls-files '*.csproj' | sort)
          listed=$(dotnet sln nocturne.sln list | { grep -E '\.csproj[[:space:]]*$' || true; } | sed 's|\\|/|g; s|[[:space:]]*$||' | sort)
          if [ -z "$tracked" ] || [ -z "$listed" ]; then
            echo "Nothing to compare: git found $(printf '%s' "$tracked" | grep -c .) csproj, nocturne.sln listed $(printf '%s' "$listed" | grep -c .)"
            exit 1
          fi
          absent=$(comm -23 <(echo "$tracked") <(echo "$listed") | { grep -vx 'scripts/Shared/Shared.csproj' || true; })
          dangling=$(comm -13 <(echo "$tracked") <(echo "$listed"))
          if [ -n "$absent" ]; then
            echo "Missing from nocturne.sln:"
            echo "$absent"
          fi
          if [ -n "$dangling" ]; then
            echo "Listed in nocturne.sln but not a tracked file:"
            echo "$dangling"
          fi
          [ -z "$absent$dangling" ]

      # A solution of the test projects, built from the directories so a new one cannot be left
      # out, and so nocturne.sln's Windows-only projects (Desktop, Widgets) never build. One
      # solution means one restore and a parallel build, the API (and its codegen) built once.
      # Unit and Integration each hold a Nocturne.API.Tests and a Nocturne.Infrastructure.Data.Tests,
      # and `dotnet sln add` silently skips a second project of the same name in one folder, hence
      # a folder each and the check that every test project produced its assembly.
      - name: Build
        run: |
          set -euo pipefail
          if [ "$BUILD_TESTS" != "true" ]; then
            dotnet build src/API/Nocturne.API/Nocturne.API.csproj -p:GenerateNSwagClient=true
            exit 0
          fi
          sln="$RUNNER_TEMP/ci/ci.slnx"
          dotnet new sln -n ci -o "$RUNNER_TEMP/ci" --format slnx
          dotnet sln "$sln" add --solution-folder Unit tests/Unit/*/*.csproj
          dotnet sln "$sln" add --solution-folder Integration tests/Integration/*/*.csproj
          dotnet sln "$sln" add --solution-folder Parity \
            tests/Parity/Nocturne.Alerts.ParityCorpus.Generator/Nocturne.Alerts.ParityCorpus.Generator.csproj
          dotnet build "$sln" -p:GenerateNSwagClient=true
          missing=0
          for project in tests/Unit/*/*.csproj tests/Integration/*/*.csproj tests/Parity/*/*.csproj; do
            dll="$(dirname "$project")/bin/Debug/net10.0/$(basename "$project" .csproj).dll"
            if [ ! -f "$dll" ]; then
              echo "::error file=$project::was not built ($dll is missing)"
              missing=1
            fi
          done
          exit "$missing"
      # Each test project's output holds its whole dependency closure, so `--no-build` needs bin and
      # obj of the test projects, plus the static web asset content roots an assembly that hosts the
      # API in Development serves from (its *.staticwebassets.runtime.json), one of them under the
      # API's obj. The outputs repeat the same assemblies many times over, which zstd's long window
      # collapses: about 2 GB packs to under 150 MB.
      - name: Package the test assemblies
        if: env.BUILD_TESTS == 'true'
        run: |
          set -euo pipefail
          mapfile -t roots < <(jq -r '.ContentRoots[]' tests/*/*/bin/Debug/net10.0/*.staticwebassets.runtime.json | sort -u)
          paths=()
          for root in "${roots[@]}"; do
            case "$root" in
              "$GITHUB_WORKSPACE"/*) [ -d "$root" ] && paths+=("${root#"$GITHUB_WORKSPACE"/}") ;;
              *) echo "::error::static web asset root $root is outside the workspace"; exit 1 ;;
            esac
          done
          tar -cf - tests/*/*/bin/Debug tests/*/*/obj "${paths[@]}" \
            | zstd -T0 -3 --long=30 -q -o "$RUNNER_TEMP/dotnet-build.tar.zst"
      - uses: actions/upload-artifact@v6
        if: env.BUILD_TESTS == 'true'
        with:
          name: dotnet-build
          path: ${{ runner.temp }}/dotnet-build.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v6
        with:
          name: api-client
          path: |
            src/Web/packages/app/src/lib/api/generated/
            src/Web/packages/app/src/lib/api/api-client.generated.ts
          if-no-files-found: error
          retention-days: 1

  unit:
    needs: [changes, build]
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-dotnet
      - uses: ./.github/actions/dotnet-build-output
      # One solution of the unit test projects, so the assemblies are tested concurrently.
      - name: Test
        run: |
          set -euo pipefail
          sln="$RUNNER_TEMP/unit/unit.slnx"
          dotnet new sln -n unit -o "$RUNNER_TEMP/unit" --format slnx
          dotnet sln "$sln" add tests/Unit/*/*.csproj
          dotnet test "$sln" --no-build \
            --filter "Category!=Integration" \
            --logger "trx;LogFileName=unit.trx" \
            --settings tests/coverage.runsettings \
            --collect "XPlat Code Coverage" \
            --results-directory TestResults/unit
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-dotnet-unit
          path: TestResults/unit/**/coverage.cobertura.xml
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: unit-trx
          path: "**/*.trx"

  # The alert-engine golden corpus (tests/Parity/AlertEngineCorpus) is the normative
  # spec for the Rust port of the leaf/node evaluation engine. While the C# engine is
  # authoritative, any behavioural change to the evaluators/tracker must regenerate the
  # corpus deliberately — this job fails if the committed corpus no longer matches what
  # the engine produces.
  alert-corpus-check:
    needs: [changes, build]
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-dotnet
      - uses: ./.github/actions/dotnet-build-output
      - name: Verify alert engine corpus is current
        run: |
          dotnet run --no-build \
            --project tests/Parity/Nocturne.Alerts.ParityCorpus.Generator -- --check

  # Rust alert engine FFI: lints + tests the crates workspace, builds the
  # nocturne_alerts cdylib, then runs the three-way parity suite (C# engine vs
  # committed corpus vs Rust engine over the C ABI) on the build job's assemblies, which find
  # the cdylib through NOCTURNE_ALERTS_NATIVE_DIR. NOCTURNE_ALERTS_REQUIRE_NATIVE
  # turns silent skips (native lib not found) into a hard failure so the parity
  # theories can never quietly stop running here.
  alerts-ffi-parity:
    needs: [changes, build]
    if: needs.changes.outputs.crates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-dotnet
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          # Sources, not just the lockfile: actions/cache restores crates/target with
          # mtimes newer than the checked-out sources, and cargo's path-package fingerprint
          # is mtime-based, so a lockfile-only key lets a source change reuse a stale build.
          key: cargo-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock', 'crates/**/*.rs', 'crates/**/Cargo.toml') }}
      # --all-features compiles the uniffi surface Prelude ships; the default-feature clippy
      # covers the cdylib the backend loads.
      - name: Rust tests, clippy, fmt
        working-directory: crates
        run: |
          cargo test --workspace --all-features
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo fmt --check
      - name: Build nocturne_alerts cdylib
        working-directory: crates
        run: cargo build --release -p nocturne-alerts-ffi
      - uses: ./.github/actions/dotnet-build-output
      - name: Three-way parity tests (C# engine vs corpus vs Rust FFI)
        env:
          NOCTURNE_ALERTS_NATIVE_DIR: ${{ github.workspace }}/crates/target/release
          NOCTURNE_ALERTS_REQUIRE_NATIVE: "1"
        run: |
          dotnet test tests/Unit/Nocturne.Alerts.Native.Tests/Nocturne.Alerts.Native.Tests.csproj \
            --no-build \
            --logger "trx;LogFileName=alerts-ffi-parity.trx"
      # Engine-seam tests (IAlertEvaluationEngine) plus every API test class holding a
      # [NativeFact]/[NativeTheory], which the unit job skips for want of the cdylib. The
      # classes are found by grep, each in a file named after it, so a new native test
      # cannot be left out; NOCTURNE_ALERTS_REQUIRE_NATIVE turns silent skips into failures.
      - name: Engine seam and native-backed API tests
        env:
          NOCTURNE_ALERTS_NATIVE_DIR: ${{ github.workspace }}/crates/target/release
          NOCTURNE_ALERTS_REQUIRE_NATIVE: "1"
          Alerts__Engine: rust
        run: |
          set -euo pipefail
          filter="FullyQualifiedName~Services.Alerts.Engines"
          while IFS= read -r file; do
            class=$(basename "$file" .cs)
            if ! grep -qE "class ${class}\b" "$file"; then
              echo "::error file=$file::holds native tests but declares no class named $class"
              exit 1
            fi
            filter="$filter|FullyQualifiedName~.${class}."
          done < <(grep -rlE '\[Native(Fact|Theory)' tests/Unit/Nocturne.API.Tests --include='*.cs')
          echo "Filter: $filter"
          dotnet test tests/Unit/Nocturne.API.Tests/Nocturne.API.Tests.csproj \
            --no-build \
            --filter "$filter" \
            --logger "trx;LogFileName=alerts-engine-seam.trx"
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: alerts-ffi-parity-trx
          path: "**/*.trx"

  # Every web check that needs no browser: typechecks, lint, and the pure-node vitest suites, on
  # the build job's generated client. After the install and the client, every step runs even when
  # an earlier one failed, so one run reports every broken check.
  # The app's check builds @nocturne/bridge and @nocturne/bot itself (tools/ensure-check-deps.mjs).
  web-static:
    needs: [changes, build]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/Web
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
        with:
          install: src/Web
      - id: client
        uses: actions/download-artifact@v5
        with:
          name: api-client
          path: src/Web/packages/app/src/lib/api
      - name: Typecheck Svelte packages
        if: ${{ !cancelled() && steps.client.outcome == 'success' }}
        run: |
          pnpm --filter @nightscout/glucose-chart --filter @nocturne/coach --filter @nocturne/ui --filter @nocturne/cms --filter @nocturne/desktop run check
      - name: Typecheck app
        if: ${{ !cancelled() && steps.client.outcome == 'success' }}
        run: pnpm --filter @nocturne/app run check
      # The portal imports the app's appearance store, which imports the generated client.
      - name: Typecheck portal
        if: ${{ !cancelled() && steps.client.outcome == 'success' }}
        run: pnpm --filter @nocturne/portal run check
      # Every package's `lint:ci` fails on any error and caps its warnings at today's count
      # (`--max-warnings` in its package.json). Caps only go down: lower one as warnings are
      # fixed, never raise it. A package's unpaid rules are downgraded to warnings by the
      # `debt({...})` block in its eslint.config.js, which records each rule's count; a package
      # with no debt block (app) allows no warnings. An eslint-disable that no longer
      # suppresses anything is an error everywhere.
      # --no-bail runs every package and fails the step if any of them failed.
      - name: Lint packages
        if: ${{ !cancelled() && steps.client.outcome == 'success' }}
        run: pnpm --recursive --no-bail --workspace-concurrency=1 run lint:ci
      - name: Bot unit tests
        if: ${{ !cancelled() && steps.client.outcome == 'success' }}
        run: pnpm --filter @nocturne/bot exec vitest run --coverage
      - name: Bridge unit tests
        if: ${{ !cancelled() && steps.client.outcome == 'success' }}
        run: pnpm --filter @nocturne/bridge exec vitest run --coverage
      - name: CMS unit tests
        if: ${{ !cancelled() && steps.client.outcome == 'success' }}
        run: pnpm --filter @nocturne/cms exec vitest run --coverage
      # Renders pages through the translation transform. The build cannot see
      # what that transform does to code that only runs at render time, and the
      # E2E suite that would is opt-in, so this is the only gate on it.
      - name: App server-rendering tests
        if: ${{ !cancelled() && steps.client.outcome == 'success' }}
        run: pnpm --filter @nocturne/app run test:render
      - name: App production translation tests
        if: ${{ !cancelled() && steps.client.outcome == 'success' }}
        run: pnpm --filter @nocturne/app exec vitest --config vitest.config.ts --run tools/ehba1c-translations.test.js
      - name: Portal unit tests
        if: ${{ !cancelled() && steps.client.outcome == 'success' }}
        run: |
          pnpm --filter @nocturne/portal exec svelte-kit sync
          pnpm --filter @nocturne/portal exec vitest run --coverage
      - name: Documentation screenshots
        if: ${{ !cancelled() && steps.client.outcome == 'success' }}
        run: |
          pnpm --filter @nocturne/screenshots run check
          pnpm --filter @nocturne/screenshots run validate
          pnpm --filter @nocturne/screenshots run check-refs
          pnpm --filter @nocturne/screenshots run check-embeds
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-web-packages
          path: src/Web/packages/*/coverage/cobertura-coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  integration-db:
    needs: [changes, build]
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-dotnet
      - uses: ./.github/actions/dotnet-build-output
      # One PostgreSQL container per test process (tests/Shared SharedPostgres), migrated once
      # and cloned per fixture; each project runs as its own process, in parallel.
      - name: Integration tests (Infrastructure.Data, Connectors, API Postgres tests)
        run: |
          set -euo pipefail
          sln="$RUNNER_TEMP/integration/integration.slnx"
          dotnet new sln -n integration -o "$RUNNER_TEMP/integration" --format slnx
          dotnet sln "$sln" add \
            tests/Integration/Nocturne.Infrastructure.Data.Tests/Nocturne.Infrastructure.Data.Tests.csproj \
            tests/Integration/Nocturne.Connectors.Tests/Nocturne.Connectors.Tests.csproj
          dotnet test "$sln" --no-build \
            --logger "trx;LogFileName=integration-db.trx" \
            --settings tests/coverage.runsettings \
            --collect "XPlat Code Coverage" \
            --results-directory TestResults/integration
          dotnet test tests/Unit/Nocturne.API.Tests/Nocturne.API.Tests.csproj --no-build \
            --filter "Category=Integration" \
            --logger "trx;LogFileName=integration-api.trx" \
            --settings tests/coverage.runsettings \
            --collect "XPlat Code Coverage" \
            --results-directory TestResults/integration
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-dotnet-integration
          path: TestResults/integration/**/coverage.cobertura.xml
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: integration-db-trx
          path: "**/*.trx"

  # The app's node unit suite and its browser component suite (vitest browser mode, headless
  # chromium), both on the build job's generated client.
  web-app-tests:
    needs: [changes, build]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: src/Web/packages/app
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
        with:
          install: src/Web
      - uses: actions/download-artifact@v5
        with:
          name: api-client
          path: src/Web/packages/app/src/lib/api
      - uses: ./.github/actions/setup-playwright
        with:
          working-directory: src/Web/packages/app
      - name: App unit tests
        run: |
          pnpm exec svelte-kit sync
          pnpm exec vitest --config vitest.config.ts --run --coverage
      - name: App browser component tests
        if: ${{ !cancelled() }}
        run: pnpm exec vitest --config vitest.browser.config.ts --run --coverage
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-web-app
          path: src/Web/packages/app/coverage/*/cobertura-coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  # tests/Integration/Nocturne.API.Tests: the API in-process on a real port against its own
  # database on the shared Postgres container, plus the Nightscout parity and migration suites
  # (their own Nightscout, MongoDB and mock containers).
  integration-api:
    needs: [changes, build]
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-dotnet
      - uses: ./.github/actions/dotnet-build-output
      - name: API integration, parity and migration tests
        run: |
          dotnet test tests/Integration/Nocturne.API.Tests/Nocturne.API.Tests.csproj --no-build \
            --filter "$(tests/quarantine.sh exclude)" \
            --logger "trx;LogFileName=integration-api.trx" \
            --results-directory TestResults/integration-api
      # tests/quarantine.txt: tests failing on a known product bug. Run so they stay visible, and
      # never fail the job; a quarantined test that passes means its line can go.
      - name: Quarantined tests (non-blocking)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          dotnet test tests/Integration/Nocturne.API.Tests/Nocturne.API.Tests.csproj --no-build \
            --filter "$(tests/quarantine.sh include)" \
            --logger "trx;LogFileName=integration-api-quarantine.trx" \
            --results-directory TestResults/integration-api-quarantine
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: integration-api-trx
          path: "**/*.trx"

  # The production API and web images, built once here (never pulled) for e2e and
  # migration-upgrade, which load them from artifacts. It starts beside `build` rather than after
  # it, to keep the e2e path short, so it generates its own client for the web image: NSwag reads
  # the portable build output, which the RID-specific image publish does not produce.
  images:
    needs: changes
    if: needs.changes.outputs.e2e == 'true' || needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-dotnet
        with:
          nuget-cache-key: nuget-e2e
      - uses: ./.github/actions/setup-pnpm
        with:
          install: src/Web
      # A docker-container builder, so the web image build can read and write the Actions cache.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Build the API and web images
        working-directory: e2e
        env:
          E2E_BUILDX_CACHE: type=gha,scope=e2e-web
        run: node scripts/stack.ts build
      - name: Save the images
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/images"
          docker save nocturne-api:e2e | zstd -T0 -3 -q -o "$RUNNER_TEMP/images/api.tar.zst"
          docker save nocturne-web:e2e | zstd -T0 -3 -q -o "$RUNNER_TEMP/images/web.tar.zst"
      - uses: actions/upload-artifact@v6
        with:
          name: e2e-image-api
          path: ${{ runner.temp }}/images/api.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v6
        with:
          name: e2e-image-web
          path: ${{ runner.temp }}/images/web.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  # The e2e suite (e2e/): the images job's images started with docker compose, then the vitest API
  # specs and the Playwright web specs.
  e2e:
    needs: [changes, images]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
        with:
          install: e2e
      - uses: actions/download-artifact@v5
        with:
          pattern: e2e-image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - name: Load the images
        run: |
          set -euo pipefail
          for image in "$RUNNER_TEMP"/images/*.tar.zst; do zstd -dc "$image" | docker load; done
      - uses: ./.github/actions/setup-playwright
        with:
          working-directory: e2e
      - name: Run the e2e suite
        working-directory: e2e
        env:
          E2E_SKIP_BUILD: "1"
        run: pnpm e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: e2e-artifacts
          path: |
            e2e/docker-compose-logs.txt
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The latest release (:latest) writes a realistic database, then the API image built from this
  # commit starts on it: migrations apply and every row reads back (e2e/scripts/migration-upgrade.ts).
  migration-upgrade:
    needs: [changes, images]
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # The script needs Node and docker, none of the e2e package's dependencies (`pnpm e2e:upgrade`
      # runs the same script).
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/download-artifact@v5
        with:
          name: e2e-image-api
          path: ${{ runner.temp }}/images
      - name: Load the API image
        run: zstd -dc "$RUNNER_TEMP/images/api.tar.zst" | docker load
      - name: Upgrade from the latest release
        working-directory: e2e
        env:
          E2E_SKIP_BUILD: "1"
        run: node scripts/migration-upgrade.ts
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: migration-upgrade-logs
          path: e2e/docker-compose-logs.txt
          if-no-files-found: ignore
          retention-days: 7

  # Merges the coverage every job above uploaded, writes the summary, posts it as the pull
  # request's sticky comment, and applies the patch coverage gate. A fork's pull request runs with
  # a read-only token, so its comment is posted by coverage-comment.yml from the uploaded report.
  coverage:
    needs: [changes, unit, integration-db, web-static, web-app-tests]
    if: ${{ !cancelled() && (needs.changes.outputs.dotnet == 'true' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: write
    env:
      COVERAGE_PATCH_THRESHOLD: ${{ vars.COVERAGE_PATCH_THRESHOLD || '60' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: actions/download-artifact@v5
        with:
          pattern: coverage-*
          path: coverage-input
      - name: Merge the .NET reports
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          reports=(coverage-input/coverage-dotnet-*/**/coverage.cobertura.xml)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "No .NET coverage in this run."
            exit 0
          fi
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.4.18
          reportgenerator \
            "-reports:$(IFS=';'; echo "${reports[*]}")" \
            -targetdir:coverage-merged \
            -reporttypes:"Cobertura;HtmlSummary" \
            -sourcedirs:"$GITHUB_WORKSPACE"
      - name: Main's baseline
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --workflow tests.yml --branch main --event push --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --name coverage-baseline --dir baseline || echo "No baseline in run $run_id"
          fi
      - name: Report
        id: report
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -o pipefail
          args=(--reports 'coverage-merged/Cobertura.xml,coverage-input/coverage-web-*/**/cobertura-coverage.xml'
                --threshold "$COVERAGE_PATCH_THRESHOLD"
                --out-markdown coverage.md --out-json coverage-summary.json)
          [ -f baseline/coverage-summary.json ] && args+=(--baseline baseline/coverage-summary.json)
          [ -n "$BASE_SHA" ] && args+=(--base "$BASE_SHA")
          status=0
          node .github/scripts/coverage-report.mjs "${args[@]}" > /dev/null || status=$?
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Package the report for the pull request comment
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p coverage-report
          cp coverage.md coverage-summary.json coverage-report/
          echo "${{ github.event.pull_request.number }}" > coverage-report/pr-number
          echo "${{ github.event.pull_request.head.sha }}" > coverage-report/head-sha
      - uses: actions/upload-artifact@v6
        if: github.event_name == 'pull_request'
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 7
      - uses: actions/upload-artifact@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: coverage-baseline
          path: coverage-summary.json
          retention-days: 90
      - uses: actions/upload-artifact@v6
        with:
          name: coverage-html
          path: coverage-merged/
          if-no-files-found: ignore
          retention-days: 7
      - name: Post the coverage comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const post = require("./.github/scripts/coverage-comment.cjs");
            const body = require("fs").readFileSync("coverage.md", "utf8");
            await post({ github, context, prNumber: Number(process.env.PR_NUMBER), body });
      - name: Patch coverage gate
        if: steps.report.outputs.status != '0'
        run: |
          echo "::error::Patch coverage is below the ${COVERAGE_PATCH_THRESHOLD}% gate (see the job summary)."
          exit 1

  # The single check to require on the branch: green when every job it needs passed or was
  # skipped for want of relevant changes.
  tests-passed:
    needs:
      - changes
      - build
      - unit
      - alert-corpus-check
      - alerts-ffi-parity
      - web-static
      - web-app-tests
      - integration-db
      - integration-api
      - images
      - e2e
      - migration-upgrade
      - coverage
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every needed job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then
            exit 1
          fi
