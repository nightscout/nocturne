  create-release:
    needs: [dotnet-images, web-image]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # deploy/docker-compose/ is a tracked, committed bundle — regenerated by
      # scripts/publish-release.cs and committed ahead of tagging a release
      # (see that script's header comment), not produced fresh in CI. Attach
      # whatever is checked out at the tag.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          gh release create "$VERSION" \
            --generate-notes \
            deploy/docker-compose/*.yaml \
            deploy/docker-compose/.env.example \
            deploy/oracle-cloud/oracle-cloud-install.sh

