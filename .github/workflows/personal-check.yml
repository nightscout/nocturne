name: Personal source checks
on:
  push:
    branches: [personal]
  pull_request:
    branches: [personal]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    name: Personal Google Health browser regression
    if: github.repository == 'smokkelaar/nocturne-personal'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/Web/packages/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: npm install --global pnpm@10.13.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec svelte-kit sync
      - run: pnpm exec vitest --config vitest.personal.config.ts --run --browser.headless
  metadata:
    name: Personal source metadata
    if: github.repository == 'smokkelaar/nocturne-personal'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 .personal/sync.py --check
      - name: Reject accidentally activated upstream publishers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          names = {p.name for p in Path('.github/workflows').iterdir()}
          assert names == {'personal-check.yml', 'personal-sync.yml'}, names
          PY
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.400'
      - name: Personal OAuth, import and access-control tests
        run: dotnet test tests/Unit/Nocturne.API.Tests -c Release -p:GenerateNSwagClient=false --filter 'FullyQualifiedName~PersonalHealthTests|FullyQualifiedName~V4WriteScopeGatingTests|FullyQualifiedName~DevTenantMemberSelectionTests' --logger 'console;verbosity=minimal'
