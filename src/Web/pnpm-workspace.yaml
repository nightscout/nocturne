packages:
  - "packages/*"

enableGlobalVirtualStore: true

# Build-script approval. pnpm v11+ gates dependency build scripts on `allowBuilds` (a per-package
# boolean map) and will block `pnpm install` — exiting non-zero — until each is explicitly set,
# which in turn breaks the API project's post-build codegen target (`pnpm run generate-zod-schemas`).
# `onlyBuiltDependencies` is the equivalent allow-list honoured by pnpm 9/10 (engines allows >=9),
# kept here for compatibility. Keep the two lists in sync.
allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  protobufjs: true
  sharp: true

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - esbuild
  - protobufjs
  - sharp

# Migrated from the package.json "pnpm" field, which pnpm v11+ no longer reads.
overrides:
  "@sveltejs/vite-plugin-svelte": "^5.0.3"
  # Pinned exactly, not as a range. A range override still lets pnpm keep several satisfying
  # copies side by side (this tree had 5.45.2, 5.50.0 and 5.55.5 at once), and svelte's `Snippet`
  # is branded with a `unique symbol` declared per copy. Two copies in one type-check program
  # therefore make every snippet-to-snippet assignment fail with "Two different types with this
  # name exist, but they are unrelated" — 20 such errors in glucose-chart's dialogs alone, and the
  # same trap for anything consuming these packages by path. One copy, one brand.
  svelte: "5.55.5"
  vite: "^6.3.5"

packageExtensions:
  tiptap-extension-auto-joiner:
    peerDependencies:
      "@tiptap/core": "*"
      "@tiptap/pm": "*"
  "@microsoft/signalr":
    dependencies:
      tough-cookie: "*"
  # The packages below import these in their shipped .d.ts (and vaul-svelte at runtime too) but
  # declare them only as devDependencies, or not at all. Under the global virtual store a package
  # resolves only what it declares, so each import is "Cannot find module" and the types that
  # depend on it silently degrade to `any` in every consumer.
  bits-ui:
    dependencies:
      csstype: "~3.1.3"
  svelte-toolbelt:
    dependencies:
      csstype: "~3.1.3"
  vaul-svelte:
    peerDependencies:
      bits-ui: "^2.0.0"
  layerchart:
    dependencies:
      "@types/d3-array": "^3.2.1"
      "@types/d3-delaunay": "^6.0.4"
      "@types/d3-geo": "^3.1.0"
      "@types/d3-hierarchy": "^3.1.7"
      "@types/d3-path": "^3.1.0"
      "@types/d3-sankey": "^0.12.4"
      "@types/d3-scale": "^4.0.8"
      "@types/d3-shape": "^3.1.6"
      "@types/d3-time": "^3.0.3"
  "@layerstack/utils":
    dependencies:
      "@types/d3-time": "^3.0.3"
  "@tiptap/extension-list":
    dependencies:
      prosemirror-model: "^1.22.1"
  remark-parse:
    dependencies:
      vfile: "^6.0.0"
  remark-html:
    dependencies:
      vfile: "^6.0.0"

# pnpm rejects a lockfile entry published within the last day. openapi-remote-codegen
# is ours (ryceg/openapi-remote-codegen) and each release exists to fix a defect in
# the wrappers this workspace generates, so waiting a day to adopt one buys nothing.
# Drop an entry once its version ages past the cutoff.
minimumReleaseAgeExclude:
  - openapi-remote-codegen@0.6.0
