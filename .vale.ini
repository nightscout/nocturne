# Vale configuration for the text Nocturne shows its users.
#
# The rules encode the mechanical half of the `simple-english` skill
# (ASD-STE100), ported from the Planner repository and adapted for UI copy.
# Vale cannot classify a string as an instruction or a description, so the
# 20-word procedural limit and the imperative rules stay a human or model job.
#
# Vale cannot read a .svelte file or a .po catalog. `pnpm run lint:copy` (in
# src/Web) writes every source string from locales/en.po to a .uicopy file,
# one string per paragraph, runs Vale over it, and maps each alert back to
# the components that use the string. Run that, not Vale directly.

StylesPath = .vale/styles
MinAlertLevel = suggestion

[formats]
uicopy = txt

[*.uicopy]
BasedOnStyles = Nocturne
